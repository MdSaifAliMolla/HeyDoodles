<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <meta name="theme-color" content="#fafafa" />
  <title>PiTorrent — Torrent client for Android</title>
  <meta name="description"
    content="PiTorrent — a torrent client for Android. Magnets, .torrent files, background downloads." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { paper: '#f5f3ec', ink: '#0a0a0a', muted: '#6b6b6b', faint: '#a3a3a3', pi: '#97e727' },
          fontFamily: {
            display: ['Jost', 'sans-serif'],
            sans: ['Montserrat', 'sans-serif'],
          },
        },
      },
    };
  </script>
  <style>
    ::selection {
      background: #0a0a0a;
      color: #f5f3ec;
    }
  </style>
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23ffffff'/><text x='50' y='74' font-size='62' text-anchor='middle' fill='black' font-family='sans-serif' font-weight='bold'>π</text></svg>" />
</head>

<body class="m-0 bg-paper font-sans text-[15px] leading-[1.5] text-ink antialiased">
  <div class="flex min-h-[100dvh] flex-col pt-[96px] max-md:pt-[80px]">
    <header
      class="fixed left-0 right-0 top-0 z-50 flex min-h-[96px] items-center justify-between gap-4 bg-paper/90 px-[66px] backdrop-blur-md backdrop-saturate-150 max-md:min-h-[80px] max-md:px-[28px]">
      <a href="../../" class="font-display text-[17px] font-extrabold tracking-[0.02em] no-underline">HEYDOODLES<span
          class="font-normal text-muted">.studio</span></a>
      <nav class="flex items-center gap-[10px]">
        <a href="privacy.html"
          class="rounded-full border border-ink bg-transparent px-[22px] py-[10px] text-[13px] font-semibold tracking-[0.1em] no-underline hover:bg-black/[0.06]">PRIVACY</a>
        <a href="mailto:heydoodleslab@gmail.com"
          class="rounded-full border border-ink bg-transparent px-[22px] py-[10px] text-[13px] font-semibold tracking-[0.1em] no-underline hover:bg-black/[0.06]">CONTACT</a>
      </nav>
    </header>
    <div class="mx-auto w-full max-w-[1120px] px-10 max-md:px-5">

      <main>
        <section id="download"
          class="grid flex-1 scroll-mt-[96px] items-center gap-12 px-0 py-[32px] pb-10 md:grid-cols-2 max-md:gap-8 max-md:py-8">
          <div class="">
            <h1
              class="m-0 font-display text-[clamp(48px,6vw,84px)] leading-[1.15] tracking-[-0.02em] font-semibold hover:underline hover:decoration-pi hover:underline-offset-4">
              PiTorrent
            </h1>
            <p class="mb-0 mt-4 max-w-[44ch] text-[18px] text-muted">A modern torrent client for Android with built in
              search and many more features
            </p>
            <div class="mt-7 flex flex-wrap gap-3">
              <a class="inline-block leading-none"
                href="https://play.google.com/store/apps/details?id=com.phitorrent.app&hl=en_IN"><img
                  src="../../assets/google-play-badge.svg" alt="Get it on Google Play" class="h-[60px] w-auto" /></a>
            </div>
          </div>
          <div
            class="reveal flex items-center justify-center opacity-0 translate-y-[18px] transition-[opacity,transform] duration-700 ease-out motion-reduce:opacity-100 motion-reduce:translate-y-0 motion-reduce:transition-none max-md:justify-start">
            <img src="../../assets/some.svg" alt="PiTorrent app screenshot"
              class="block h-[min(72vh,760px)] max-h-none min-h-[460px] w-auto max-w-full rounded-lg border border-black/15 shadow-[0_24px_60px_rgba(0,0,0,0.2),0_4px_12px_rgba(0,0,0,0.1)] drop-shadow-[0_18px_28px_rgba(0,0,0,0.12)] max-md:h-auto max-md:min-h-0 max-md:w-[min(340px,85%)]" />
          </div>
        </section>
      </main>
    </div>
  </div>

  <div id="snackbar" role="status"
    class="fixed bottom-6 left-1/2 z-[60] -translate-x-1/2 translate-y-[80px] whitespace-nowrap rounded-full bg-ink px-[22px] py-3 text-[13.5px] font-medium text-paper opacity-0 transition-all duration-300">
    Copied</div>
  <script src="../../script.js"></script>
</body>

</html>
