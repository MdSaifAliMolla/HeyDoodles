<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <meta name="theme-color" content="#fafafa" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { paper: '#f5f3ec', ink: '#0a0a0a', muted: '#6b6b6b', faint: '#a3a3a3', pi: '#97e727' },
          fontFamily: {
            display: ['Jost', 'sans-serif'],
            sans: ['Montserrat', 'sans-serif'],
          },
        },
      },
    };
  </script>
  <style>
    ::selection {
      background: #0a0a0a;
      color: #f5f3ec;
    }

    .giant-text {
      font-family: 'Jost', 'Montserrat', sans-serif;
      font-weight: 700;
      fill: #0a0a0a;
    }
  </style>
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23ffffff'/><text x='50' y='72' font-size='60' text-anchor='middle' fill='black' font-family='sans-serif' font-weight='bold'>H</text></svg>" />
</head>

<body class="m-0 bg-paper font-sans text-[15px] leading-[1.5] text-ink antialiased">
  <h1 class="sr-only">HeyDoodles</h1>
  <div class="flex h-[100dvh] flex-col overflow-clip px-10 pt-[96px] max-md:px-5 max-md:pt-[80px]">
    <!-- fixed nav, no divider, roomy horizontal gutter -->
    <header
      class="fixed left-0 right-0 top-0 z-50 flex min-h-[96px] items-center justify-between gap-4 bg-paper/90 px-[66px] backdrop-blur-md backdrop-saturate-150 max-md:min-h-[80px] max-md:px-[28px]">
      <a href="./" class="font-display text-[17px] font-extrabold tracking-[0.02em] no-underline">HEYDOODLES<span
          class="font-normal text-muted">.studio</span></a>
      <nav class="flex items-center gap-[10px]">
        <a href="apps/"
          class="rounded-full border border-ink bg-ink px-[22px] py-[10px] text-[13px] font-semibold tracking-[0.1em] text-paper no-underline hover:opacity-[0.82]">APPS</a>
        <a href="mailto:heydoodleslab@gmail.com"
          class="rounded-full border border-ink bg-transparent px-[22px] py-[10px] text-[13px] font-semibold tracking-[0.1em] no-underline hover:bg-black/[0.06]">CONTACT</a>
      </nav>
    </header>

    <div class="flex-1"></div>

    <section class="border-t border-black/15 pt-3">
      <a href="apps/pitorrent/" class="group block no-underline">
        <span class="block pb-2 text-[13px] font-semibold tracking-[0.04em] text-muted">Recent Work</span>
        <span
          class="block text-[clamp(22px,3vw,32px)] font-semibold leading-[1.15] tracking-[-0.02em] group-hover:underline group-hover:decoration-pi group-hover:underline-offset-4">PiTorrent</span>
        <span
          class="block text-[clamp(22px,3vw,32px)] font-semibold leading-[1.15] tracking-[-0.02em] text-muted">Torrent
          client for Android</span>
      </a>
    </section>

    <div class="-mx-10 mt-6 leading-none max-md:-mx-5" aria-hidden="true">
      <svg viewBox="0 0 1000 150" preserveAspectRatio="xMidYMax meet" role="presentation" class="block h-auto w-full">
        <text x="500" y="140" text-anchor="middle" font-size="170" textLength="984" lengthAdjust="spacingAndGlyphs"
          class="giant-text">HEYDOODLES</text>
      </svg>
    </div>
  </div>
</body>

</html>
